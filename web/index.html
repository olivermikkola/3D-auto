<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>GTÅ: Grand Tour Åbo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
    #log { position: fixed; left: 8px; bottom: 8px; max-width: 90vw; max-height: 40vh; overflow: hidden;
           font: 12px/1.35 ui-monospace, monospace; color: #ddd; background: rgba(0, 0, 0, 0.6);
           padding: 6px 8px; border-radius: 4px; white-space: pre-wrap; pointer-events: none; }
    #log:empty { display: none; }
    /* The game is played sideways; held upright, a phone shows this instead. */
    #turn { display: none; position: fixed; inset: 0; z-index: 2; background: #111; color: #eee;
            font: 20px/1.4 system-ui, sans-serif; text-align: center;
            align-items: center; justify-content: center; flex-direction: column; }
    #turn b { font-size: 64px; display: block; transform: rotate(90deg); margin-bottom: 24px; }
    @media (orientation: portrait) { .touch #turn { display: flex; } }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <div id="log">Loading…</div>
  <div id="turn"><b>&#x1F4F1;</b>Turn your phone sideways</div>
  <script src="gl.js"></script>
  <script>
    // Lines the game prints, also on the page: there is no console on a phone.
    // The box goes away a few seconds after the last line (longer after an
    // error), so loading a map from the menu doesn't leave it up; ?log=1
    // keeps it.
    const box = document.getElementById("log");
    const keep = new URLSearchParams(location.search).has("log");
    let lines = [], started = false, hide = 0;
    function show(text) {
      lines.push(text);
      if (lines.length > 30) lines = lines.slice(-30);
      box.textContent = lines.join("\n");
      if (started) later();
    }
    function later() {
      if (keep) return;
      clearTimeout(hide);
      const bad = /error|panic/i.test(box.textContent);
      hide = setTimeout(() => { box.textContent = ""; lines = []; }, bad ? 20000 : 6000);
    }
    window.addEventListener("error", e => show("error: " + e.message));

    // Sound: the game mixes, WebAudio plays (src/audio.rs). Browsers start
    // audio only after a touch or a key, so the context waits for one, and
    // it rests while the page is hidden (phone locked, another app).
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const audio = Ctx ? new Ctx({ latencyHint: "interactive" }) : null;
    if (audio) {
      const n = 4096; // ~85 ms: a slow frame on a phone must not starve it
      const node = audio.createScriptProcessor(n, 0, 2);
      node.onaudioprocess = e => {
        const l = e.outputBuffer.getChannelData(0), r = e.outputBuffer.getChannelData(1);
        if (typeof wasm_exports === "undefined" || !wasm_exports || !wasm_exports.auto_audio_mix) return;
        const s = new Float32Array(wasm_memory.buffer, wasm_exports.auto_audio_mix(n), 2 * n);
        for (let i = 0; i < n; i++) { l[i] = s[2 * i]; r[i] = s[2 * i + 1]; }
      };
      node.connect(audio.destination);
      const wake = () => { if (audio.state !== "running" && !document.hidden) audio.resume(); };
      for (const ev of ["pointerdown", "touchend", "keydown"]) window.addEventListener(ev, wake, true);
      document.addEventListener("visibilitychange", () => document.hidden ? audio.suspend() : wake());
    }

    // Saves in localStorage, each key as "gta/<key>" (src/save.rs, src/web.rs).
    const enc = new TextEncoder(), dec = new TextDecoder();
    const bytes = (p, n) => new Uint8Array(wasm_memory.buffer, p, n);
    const text = (p, n) => dec.decode(bytes(p, n).slice());
    function put(ptr, cap, s) {
      const b = enc.encode(s);
      if (b.length <= cap) bytes(ptr, b.length).set(b);
      return b.length;
    }
    function touch_screen() {
      return matchMedia("(pointer: coarse)").matches
        || (navigator.maxTouchPoints > 1 && /Macintosh|iPhone|iPad/.test(navigator.userAgent));
    }
    if (touch_screen()) document.documentElement.classList.add("touch");
    function storage() { try { return window.localStorage; } catch (e) { return null; } }
    // Ask the browser not to clear the saves when space runs low.
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    miniquad_add_plugin({
      name: "auto_web",
      version: 1,
      register_plugin(imports) {
        const log = imports.env.console_log;
        imports.env.console_log = ptr => { show(UTF8ToString(ptr)); log(ptr); };
        // The page's query string, for the game's environment (src/web.rs).
        // A touch screen as the main pointer (a phone or tablet) adds phone=1,
        // also an iPhone in "desktop website" mode (it says it's a Mac with
        // a fine pointer; a real Mac has no touch points),
        // so a first start picks the low graphics preset (lib/settings).
        imports.env.web_query = (ptr, cap) => {
          let search = location.search;
          if (touch_screen() && !/[?&]phone=/.test(search)) {
            search += (search ? "&" : "?") + "phone=1";
          }
          const q = new TextEncoder().encode(search);
          new Uint8Array(wasm_memory.buffer, ptr, Math.min(cap, q.length)).set(q.subarray(0, cap));
          return q.length;
        };
        imports.env.web_save_get = (kp, kl, ptr, cap) => {
          const v = storage() && storage().getItem("gta/" + text(kp, kl));
          return v === null || v === undefined ? -1 : put(ptr, cap, v);
        };
        imports.env.web_save_set = (kp, kl, vp, vl) => {
          const st = storage();
          if (!st) return -1;
          try {
            const k = "gta/" + text(kp, kl);
            if (vp === 0) st.removeItem(k); else st.setItem(k, text(vp, vl));
            return 0;
          } catch (e) { show("save: " + e.message); return -1; }
        };
        imports.env.web_save_keys = (ptr, cap) => {
          const st = storage(), keys = [];
          for (let i = 0; st && i < st.length; i++) {
            const k = st.key(i);
            if (k.startsWith("gta/")) keys.push(k.slice(4));
          }
          return put(ptr, cap, keys.join("\n"));
        };
        imports.env.web_audio_rate = () => audio ? audio.sampleRate : 0;
      },
      on_init() {
        box.textContent = "";
        lines = [];
        started = true;
      },
    });
    load("auto.wasm");
    // Installable, and playable offline once installed (sw.js). Browsers only
    // allow this over https or on localhost.
    // On the first tap: full screen and locked sideways where the browser
    // allows it (Android; an iPhone ignores both, and #turn covers that).
    // Browsers only grant these from a tap, and the end of one is.
    document.addEventListener("pointerup", function first(e) {
      if (e.pointerType == "mouse") return;
      document.removeEventListener("pointerup", first);
      const lock = () => screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape").catch(() => {});
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen({navigationUI: "hide"}).then(lock, lock);
      else lock();
    });
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(e => show("offline cache: " + e.message));
  </script>
</body>
</html>
