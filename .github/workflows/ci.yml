name: ci
on: [push, pull_request]

jobs:
  # Build, lint and play the game headlessly on every platform we ship.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - name: Headless autoplay (scripted playthrough, mods, sandbox)
        run: AUTO_TEST=1 ./target/release/auto game --headless 9000
      - name: Saves across restarts (write, reload, corrupt)
        run: |
          rm -rf saves-test
          SAVE_TEST=1 ./target/release/auto game --headless 600 --save-dir saves-test
          SAVE_TEST=2 ./target/release/auto game --headless 600 --save-dir saves-test
          echo 'return { cash = ' > saves-test/progress.lua
          SAVE_TEST=3 ./target/release/auto game --headless 600 --save-dir saves-test
          test -f saves-test/progress.lua.bad
      - name: Pause menu and settings across a restart
        run: |
          rm -rf menu-test
          MENU_TEST=1 ./target/release/auto game --headless 900 --save-dir menu-test
          MENU_TEST=2 ./target/release/auto game --headless 900 --save-dir menu-test
      - name: Soak (5 simulated minutes)
        if: runner.os == 'Linux'
        run: SOAK=1 ./target/release/auto game --headless 18000
