name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build, lint and play the game headlessly on every platform we ship.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools -p "test_*.py"
      # One runner plays every headless test and checks each printed PASSED
      # marker, not just the exit code. On pull requests, all OS runners run
      # the fast smoke test (default seed, no soak) so CI finishes in ~2 mins.
      # Deep multi-seed testing and the 300s soak run on merge to main.
      - name: Headless tests (all seeds, both maps)
        if: github.event_name != 'pull_request' && runner.os != 'macOS'
        run: python tools/headless_tests.py --output headless-results ${{ runner.os == 'Linux' && '--soak' || '' }}
      - name: Headless tests (the starter map people copy for their own city)
        if: github.event_name != 'pull_request' && runner.os == 'Linux'
        run: python tools/headless_tests.py --output headless-results/starter --maps starter --seeds 1337
      - name: "Headless tests (fast PR smoke test, default seed)"
        if: github.event_name == 'pull_request' || runner.os == 'macOS'
        run: python tools/headless_tests.py --output headless-results --seeds 1337
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-results-${{ matrix.os }}
          path: headless-results
          if-no-files-found: ignore
