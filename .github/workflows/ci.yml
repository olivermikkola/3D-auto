name: ci
# Changes only to docs or the browser build (pages.yml checks that) don't
# play the game: the tests would take 15+ minutes to prove nothing.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "web/**", ".github/workflows/pages.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "web/**", ".github/workflows/pages.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The test files, split four ways on Linux machines side by side (a free
  # public repo gets up to 20 at once): all of them on every pull request in
  # about a quarter of the time (they were 15-20 minutes on one machine).
  tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/run_tests.py --skip "test_*_sweep.py" --shard ${{ matrix.shard }}/4

  # Build, lint and play the game headlessly on every platform we ship. On a
  # pull request Windows and macOS build, lint, run the Rust tests and the
  # headless smoke test (the test files above are the same game on Linux;
  # macOS machines are often queued for many minutes); on main they run
  # every test file too, so a platform's own trouble still shows within the
  # hour.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Side by side, one process per test file. (Linux: the shards above.)
      - if: github.event_name != 'pull_request' && runner.os != 'Linux'
        run: python tools/run_tests.py --skip "test_*_sweep.py"
      # Render Turku's landmarks and check the pixels: a landmark that is
      # black, buried or somewhere else fails here, before it is merged.
      - name: Landmark render checks (software GL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          RENDER_CHECKS=1 RENDER_CHECKS_OUT=landmark-renders LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a -s "-screen 0 1280x720x24" python -m unittest tools/test_landmark_renders.py tools/test_profile_gpu.py
      - name: Upload landmark renders
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: landmark-renders
          path: landmark-renders
          if-no-files-found: ignore
      # One runner plays every headless test and checks each printed PASSED
      # marker, not just the exit code. On pull requests, all OS runners run
      # the fast smoke test (default seed, no soak) so CI finishes in ~2 mins.
      # Deep multi-seed testing and the 300s soak run on merge to main.
      - name: Headless tests (all seeds, both maps)
        if: github.event_name != 'pull_request' && runner.os != 'macOS'
        run: python tools/headless_tests.py --output headless-results ${{ runner.os == 'Linux' && '--soak' || '' }}
      - name: Headless tests (the starter map people copy for their own city)
        if: github.event_name != 'pull_request' && runner.os == 'Linux'
        run: python tools/headless_tests.py --output headless-results/starter --maps starter --seeds 1337
      - name: "Headless tests (fast PR smoke test, default seed)"
        if: github.event_name == 'pull_request' || runner.os == 'macOS'
        run: python tools/headless_tests.py --output headless-results --seeds 1337
      # After the others, which create headless-results.
      # Turku, the real city, at the default seed, every check included.
      - name: Headless tests (Turku, default seed)
        if: runner.os == 'Linux'
        run: python tools/headless_tests.py --output headless-results/turku --maps turku --seeds 1337
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-results-${{ matrix.os }}
          path: headless-results
          if-no-files-found: ignore

  # The sweeps drive every map's roads: map data and the game's own
  # physics, the same on every OS, so Linux only, one map per machine
  # (both maps on one took 12-21 minutes).
  sweeps:
    strategy:
      fail-fast: false
      matrix:
        map: [turku, raisio]
    name: sweeps (${{ matrix.map }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/run_tests.py --only "test_*_sweep.py"
        env:
          SWEEP_MAPS: ${{ matrix.map }}
