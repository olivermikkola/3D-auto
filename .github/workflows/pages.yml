name: pages
# The browser build (web/), checked in headless Chromium on every PR and
# published to GitHub Pages from main: https://olivermikkola.github.io/3D-auto/
# On a phone, open that address and "Add to Home Screen" (see web/README.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web
      - name: wasi-sdk
        run: |
          curl -sSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - run: web/build.sh
      # Headless Chromium with software WebGL, at a phone's landscape size.
      - name: Turku in the browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 tools/web_check.py --browser chromium --size 844x390 --query "map=turku&seed=1337&hour=12" --wait 60 --report web-turku.json --shot web-turku.png
      - name: Saves and sound in the browser
        run: python3 tools/web_saves_sound.py --shot web-saves.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-check
          path: |
            web-turku.json
            web-turku.png
            web-saves.png
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
