[package]
name = "auto"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "0.22"
miniquad = "0.4"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
serde_json = "1"

[features]
# The wgpu renderer (Vulkan, Metal, DX12; docs/RENDERER.md): screenshots
# with --render-size and a window with --wgpu. The browser build is OpenGL
# only; `--no-default-features` builds the OpenGL-only engine.
default = ["wgpu-postcard"]
wgpu-postcard = ["dep:bytemuck", "dep:pollster", "dep:wgpu", "dep:winit"]
# Play in the wgpu window by default (--gl for the OpenGL one).
wgpu-window = ["wgpu-postcard"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bytemuck = { version = "1", features = ["derive", "min_const_generics"], optional = true }
pollster = { version = "0.4", optional = true }
wgpu = { version = "=29.0.3", default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12"], optional = true }
winit = { version = "0.30", optional = true }

[target.'cfg(not(any(target_os = "linux", target_arch = "wasm32")))'.dependencies]
cpal = "0.15"
gilrs = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# No panic = "abort": on Windows, Lua errors unwind through Rust frames
# (MSVC longjmp is an SEH unwind), which abort-on-panic turns into a crash.
