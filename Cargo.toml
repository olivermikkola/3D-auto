[package]
name = "auto"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
miniquad = "0.4"
mlua = { version = "0.10", features = ["lua54", "vendored"] }

[target.'cfg(not(any(target_os = "linux", target_arch = "wasm32")))'.dependencies]
cpal = "0.15"
gilrs = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# No panic = "abort": on Windows, Lua errors unwind through Rust frames
# (MSVC longjmp is an SEH unwind), which abort-on-panic turns into a crash.
